---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {%- if page.category %} ¤ {{ page.category }}{% endif -%}
    </p>
  </header>
  {{ content }}
  <footer class="post-footer">
    — <a href="/">Nick Quaranto</a>
    {%- if page.original_url %} ¤ originally published at <a href="{{ page.original_url }}">quaran.to</a>{% endif %}
  </footer>
</article>
